[package]
name = "relay-core-probe"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP probe adapter for relay-core: exposes traffic inspection and control to AI agents"

[features]
default = ["transport-stdio"]
transport-stdio = ["rmcp/transport-io"]
transport-sse = ["rmcp/transport-streamable-http-server"]

[dependencies]
relay-core-api.workspace = true
relay-core-runtime = { path = "../relay-core-runtime", version = "0.1.2" }
rmcp = { version = "1.2.0", features = ["server", "transport-io"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait = "0.1.89"
regex = "1.10"
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
uuid.workspace = true
url.workspace = true
