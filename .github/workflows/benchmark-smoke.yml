name: Benchmark Smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Benchmark Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3
          curl -fsSL https://github.com/hatoo/oha/releases/download/v1.14.0/oha-linux-amd64 -o /usr/local/bin/oha
          chmod +x /usr/local/bin/oha
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # relay-core-http's build script requires the embedded Web UI assets, and they are gitignored:
      # building the CLI without them panics in build.rs. The benchmark harness builds the CLI, so this
      # has to run first — it was missing here while `ci.yml` has always done it.
      - name: Build webui assets (embedded by relay-core-http)
        shell: bash
        run: ./scripts/webui-build.sh


      - name: Run Benchmark (single, quick)
        run: |
          chmod +x ./benchmarks/bench_minimal.sh
          ./benchmarks/bench_minimal.sh quick

      - name: Run Benchmark (matrix, short)
        run: |
          ./benchmarks/bench_minimal.sh matrix --duration 5

      - name: Print Latest Benchmark Summary
        shell: bash
        run: |
          set -euo pipefail
          latest_json="$(ls -1t benchmarks/results/bench_*.json | head -n1)"
          echo "Latest report: ${latest_json}"
          python3 benchmarks/print_summary.py "${latest_json}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke-results
          path: benchmarks/results/
          if-no-files-found: warn
