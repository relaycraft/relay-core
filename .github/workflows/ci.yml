name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Single gate aligned with scripts/ci-check.sh (fmt → clippy → test).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-workspace

      - name: Rust quality gate
        run: ./scripts/ci-check.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm set-version smoke (release scripts)
        run: node npm/scripts/set-version.js v0.0.0-ci-smoke

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-workspace

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run coverage
        run: cargo llvm-cov --workspace --summary-only
