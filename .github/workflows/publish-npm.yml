name: Publish npm

on:
  push:
    tags: ["v*"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-workspace
      - run: ./scripts/ci-check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node npm/scripts/set-version.js ${{ github.ref_name }}

  publish-binaries:
    needs: quality
    strategy:
      # Cancel remaining matrix legs once one fails — avoids many half-published platform versions.
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            npm_platform: linux-x64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            npm_platform: linux-arm64
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            npm_platform: darwin-x64
            os: macos-latest
          - target: aarch64-apple-darwin
            npm_platform: darwin-arm64
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            npm_platform: win32-x64
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cross-compilation (linux arm64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Build binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --package relay-core-cli --target ${{ matrix.target }}
          cargo build --release --package relay-core-probe --target ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set package versions from tag
        run: node npm/scripts/set-version.js ${{ github.ref_name }}

      - name: Stage platform package binaries (unix)
        if: runner.os != 'Windows'
        run: |
          PKG="npm/packages/binaries-${{ matrix.npm_platform }}/bin"
          rm -f "$PKG"/*
          cp "target/${{ matrix.target }}/release/relay-core-cli" "$PKG/"
          cp "target/${{ matrix.target }}/release/relay-core-probe" "$PKG/"
          chmod +x "$PKG/relay-core-cli" "$PKG/relay-core-probe"

      - name: Stage platform package binaries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "target/${{ matrix.target }}/release"
          $cli = Join-Path $root "relay-core-cli.exe"
          $probe = Join-Path $root "relay-core-probe.exe"
          if (-not (Test-Path $cli)) { throw "Build did not produce $cli — check the Build binaries step above" }
          if (-not (Test-Path $probe)) { throw "Build did not produce $probe — check the Build binaries step above" }
          $pkg = "npm/packages/binaries-${{ matrix.npm_platform }}/bin"
          Remove-Item "$pkg/*" -ErrorAction SilentlyContinue
          Copy-Item $cli $pkg
          Copy-Item $probe $pkg

      - name: Publish @relay-core/binaries-${{ matrix.npm_platform }}
        run: npm publish --access public
        working-directory: npm/packages/binaries-${{ matrix.npm_platform }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-wrappers:
    needs: publish-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Set package versions from tag
        run: node npm/scripts/set-version.js ${{ github.ref_name }}

      - name: Verify all platform packages on npm registry
        run: node npm/scripts/verify-platform-packages.js ${{ github.ref_name }}

      - name: Publish @relay-core/cli
        run: npm publish --access public
        working-directory: npm/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @relay-core/mcp
        run: npm publish --access public
        working-directory: npm/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
