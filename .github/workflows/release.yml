name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.ai.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate AI release notes
        id: ai
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            release_url="https://github.com/relaycraft/relay-core/commits/${{ github.ref_name }}"
            echo "body=## Changes%0ASee [CHANGELOG](${release_url}) for details." >> $GITHUB_OUTPUT
            exit 0
          fi
          prev_tag=$(git tag --sort=-version:refname | sed -n '2p')
          commits=$(git log --oneline --no-merges "${prev_tag}..HEAD" | sed 's/"/\\"/g' | tr '\n' ' ')
          prompt="根据以下 commits 生成一份 Release Notes。中英双语，按 Features/Fixes/Chores 分类。每条写一句话。最后加一小段总结。\n\nCommits: ${commits}"
          response=$(curl -s "${LLM_BASE_URL}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -d "$(node -e "console.log(JSON.stringify({model:'MiniMax-M2.7',messages:[{role:'user',content:process.argv[1]}]}))" "$prompt")")
          body=$(echo "$response" | python3 -c "
import sys,json,re
c=json.load(sys.stdin)['choices'][0]['message']['content']
c=re.sub(r'<think>.*?</think>\s*','',c,flags=re.DOTALL)
print(c)
" 2>/dev/null)
          if [ -z "$body" ]; then
            release_url="https://github.com/relaycraft/relay-core/commits/${{ github.ref_name }}"
            echo "body=## Changes%0ASee [CHANGELOG](${release_url}) for details." >> $GITHUB_OUTPUT
            exit 0
          fi
          body="${body//'%'/'%25'}"
          body="${body//$'\n'/'%0A'}"
          body="${body//$'\r'/'%0D'}"
          echo "body=${body}" >> $GITHUB_OUTPUT

  build:
    needs: notes
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build relay-core-cli
        run: cargo build --release --package relay-core-cli --target ${{ matrix.target }}

      - name: Build relay-core-probe
        run: cargo build --release --package relay-core-probe --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf relay-core-cli-${{ matrix.target }}.tar.gz relay-core-cli
          tar czf relay-core-probe-${{ matrix.target }}.tar.gz relay-core-probe

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a relay-core-cli-${{ matrix.target }}.zip relay-core-cli.exe
          7z a relay-core-probe-${{ matrix.target }}.zip relay-core-probe.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/relay-core-cli-${{ matrix.target }}.*
            target/${{ matrix.target }}/release/relay-core-probe-${{ matrix.target }}.*
          body: ${{ needs.notes.outputs.body }}
          generate_release_notes: false
