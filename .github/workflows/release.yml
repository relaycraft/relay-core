name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      has-notes: ${{ steps.gen.outputs.has_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: gen
        name: Generate AI release notes
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev_tag=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$prev_tag" ]; then
            prev_tag=$(git rev-list --max-parents=0 HEAD)
          fi
          commits=$(git log --oneline --no-merges "${prev_tag}..HEAD" | tr '\n' ' ')
          prompt="根据以下 commits 生成 Release Notes。中英双语，按 Features/Fixes/Chores 分类。每条一句。最后一段总结。\n\nCommits: ${commits}"
          response=$(curl -s "${LLM_BASE_URL}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -d "$(node -e 'console.log(JSON.stringify({model:"MiniMax-M2.7",messages:[{role:"user",content:process.argv[1]}]}))' "$prompt")")
          echo "$response" | python3 -c "
import sys,json,re
c=json.load(sys.stdin)['choices'][0]['message']['content']
c=re.sub(r'<think>.*?</think>\s*','',c,flags=re.DOTALL)
with open('notes.md','w') as f: f.write(c)
" 2>/dev/null || { echo "has_notes=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "has_notes=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.gen.outputs.has_notes == 'true'
        with:
          name: release-notes
          path: notes.md

  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build relay-core-cli
        run: cargo build --release --package relay-core-cli --target ${{ matrix.target }}

      - name: Build relay-core-probe
        run: cargo build --release --package relay-core-probe --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf relay-core-cli-${{ matrix.target }}.tar.gz relay-core-cli
          tar czf relay-core-probe-${{ matrix.target }}.tar.gz relay-core-probe

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a relay-core-cli-${{ matrix.target }}.zip relay-core-cli.exe
          7z a relay-core-probe-${{ matrix.target }}.zip relay-core-probe.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/relay-core-cli-${{ matrix.target }}.*
            target/${{ matrix.target }}/release/relay-core-probe-${{ matrix.target }}.*

  finalize:
    needs: [notes, build]
    runs-on: ubuntu-latest
    if: needs.notes.outputs.has-notes == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Update release body
        run: |
          gh release edit "${{ github.ref_name }}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
