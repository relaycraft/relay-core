name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-workspace
      - run: ./scripts/ci-check.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node npm/scripts/set-version.js ${{ github.ref_name }}

  notes:
    runs-on: ubuntu-latest
    outputs:
      has-notes: ${{ steps.gen.outputs.has_notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: gen
        name: Generate AI release notes
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
        run: |
          if [ -z "$LLM_API_KEY" ]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prev_tag=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$prev_tag" ]; then
            prev_tag=$(git rev-list --max-parents=0 HEAD)
          fi
          user_commits=$(git log --format=%s --no-merges "${prev_tag}..HEAD" | grep -E '^(feat|fix)(\(|:)' | tr '\n' ' ' || true)
          if [ -z "$user_commits" ]; then
            user_commits=$(git log --oneline --no-merges "${prev_tag}..HEAD" | tr '\n' ' ')
          fi
          prompt="根据以下 feat/fix commits 生成 Release Notes（中英双语，Features / Fixes 两类，每条一句，最后一段总结）。不要逐条展开 chore/ci/refactor/test/docs；若需提及维护项，最多用一句概括。\n\nCommits: ${user_commits}"
          response=$(curl -s "${LLM_BASE_URL}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${LLM_API_KEY}" \
            -d "$(node -e 'console.log(JSON.stringify({model:"MiniMax-M2.7",messages:[{role:"user",content:process.argv[1]}]}))' "$prompt")")
          echo "$response" | node -e "const c=JSON.parse(require('fs').readFileSync(0,'utf8')).choices[0].message.content;require('fs').writeFileSync('notes.md',c.replace(/<think>[\s\S]*?<\/think>/g,''))" 2>/dev/null || { echo "has_notes=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "has_notes=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.gen.outputs.has_notes == 'true'
        with:
          name: release-notes
          path: notes.md

  build:
    needs: quality
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup cross-compilation (linux arm64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Build relay-core-cli (native)
        run: cargo build --release --package relay-core-cli --target ${{ matrix.target }}

      - name: Build relay-core-probe (native)
        run: cargo build --release --package relay-core-probe --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf relay-core-cli-${{ matrix.target }}.tar.gz relay-core-cli
          tar czf relay-core-probe-${{ matrix.target }}.tar.gz relay-core-probe

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a relay-core-cli-${{ matrix.target }}.zip relay-core-cli.exe
          7z a relay-core-probe-${{ matrix.target }}.zip relay-core-probe.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/relay-core-cli-${{ matrix.target }}.*
            target/${{ matrix.target }}/release/relay-core-probe-${{ matrix.target }}.*

  finalize:
    needs: [notes, build]
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: release-notes

      - name: Assemble and update release body
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="assembled-notes.md"

          if [ -f notes.md ]; then
            cat notes.md > "$OUT"
          else
            echo "# RelayCore v${VERSION}" > "$OUT"
          fi

          BASELINE="benchmarks/results/baseline_v${VERSION}.md"
          if [ -f "$BASELINE" ]; then
            echo "" >> "$OUT"
            echo "---" >> "$OUT"
            echo "" >> "$OUT"
            cat "$BASELINE" >> "$OUT"
          else
            echo "" >> "$OUT"
            echo "_No benchmarks/results/baseline_v${VERSION}.md at this tag._" >> "$OUT"
          fi

          gh release edit "${GITHUB_REF_NAME}" --notes-file "$OUT"
        env:
          GH_TOKEN: ${{ github.token }}
