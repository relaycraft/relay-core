# cargo-deny configuration.
#
# The point of this file is the `advisories` check: a known-vulnerable dependency is a release
# blocker, and nothing verified that before. `licenses` and `bans` are set to the project's own
# policy (MIT) with the permissive licences this dependency tree actually uses, so the job fails for
# a real reason rather than for licence archaeology.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
# Fail on vulnerabilities, unmaintained crates and yanked releases. In cargo-deny 0.19 these are
# severity thresholds rather than on/off switches.
unmaintained = "workspace"
yanked = "deny"
# Deliberately empty. The tree currently has a backlog of advisories (see
# docs/engine-capability-status.md §2.5), and they are listed rather than ignored: an ignore entry
# here would record a security decision nobody has taken yet. Until that triage happens the CI audit
# job is a tracker, not a gate — switching it to blocking requires either the upgrades or an explicit
# decision to accept each advisory.
ignore = []

[licenses]
version = 2
# Only licences that permit redistribution under this project's MIT terms.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    # Mozilla's root-certificate data, used by `webpki-roots`.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = []
